<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Hostel Mess System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <h1>Hostel Mess System</h1>
    <p class="muted">Log in to manage meals, leave and medicines.</p>
    <div id="loginMsg" class="message" hidden></div>
    <form id="loginForm" novalidate>
      <label>Email
        <input type="email" id="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="center small">New student? <a href="register.html">Create an account</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    "use strict";
    Auth.clearSession();

    const params = new URLSearchParams(window.location.search);
    if (params.get("registered")) {
      UI.showMessage("loginMsg", "Account created. Please log in.", "success");
    } else if (params.get("expired")) {
      UI.showMessage("loginMsg", "Your session has expired. Please log in again.", "info");
    }

    UI.$("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      UI.clearMessage("loginMsg");
      const email = UI.$("email").value;
      const password = UI.$("password").value;
      if (!email.trim() || !password) {
        UI.showMessage("loginMsg", "Enter your email and password.", "error");
        return;
      }
      const button = UI.$("loginBtn");
      button.disabled = true;
      try {
        await Auth.login(email, password);
      } catch (err) {
        UI.showMessage("loginMsg", err.message, "error");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
