# Nginx site for the Hostel Mess System.
# Installed by setup-server.sh as /etc/nginx/conf.d/hostel-mess.conf
#
#   /      -> the static frontend files in /var/www/hostel-mess
#   /api/  -> the Spring Boot backend on port 8080 (same origin, so no CORS needed)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hostel-mess;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
